name: deploy

# Frontend CD (mirrors the backend's deploy pipeline). Build the web image -> push to
# the luciel-<env>-web ECR repo (owned by the backend CDK app); build the widget
# bundle -> sync to the widget S3 bucket + invalidate CloudFront; then roll the
# web ECS service and wait until it is stable. Dispatch only (no push trigger, and the
# `guard` job refuses any ref but the release branch, `main`); dev via environment=dev.
# A prod deploy needs an explicit workflow_dispatch with environment=prod AND the
# approval of the `prod` GitHub Environment's required reviewer (the deploy-prod job
# runs in that environment). prod is never auto-deployed, and a prod dispatch does
# not roll dev.
# NOTE: the authoritative pre-prod verification gate lives in the BACKEND pipeline
# (ephemeral prod-shaped preprod). This frontend prod deploy is the manual, gated
# frontend rollout that follows a passed backend release.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  id-token: write
  contents: read

concurrency:
  # Keyed by ENVIRONMENT, not ref: two branches must never deploy the same
  # environment concurrently (the ref-scoped group let them).
  group: fe-deploy-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

env:
  AWS_REGION: ca-central-1
  ACCOUNT: '729005488042'

jobs:
  # ---- GUARD: deploys run ONLY from the release branch --------------------------
  # Every job below checks out whatever ref was dispatched. 2026-09-06: a dispatch
  # without `--ref` deployed the then-stale `main` to dev for 25 minutes. Since
  # 2026-11-13 `main` IS the release branch and the default branch (the former
  # release branch was merged into it and retired), and this job still refuses any
  # other ref before a single AWS call (CLAUDE.md "Branch discipline").
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse any ref that is not the release branch
        env:
          RELEASE_BRANCH: ${{ vars.RELEASE_BRANCH || 'main' }}
        run: |
          if [ "${{ github.ref_name }}" != "$RELEASE_BRANCH" ]; then
            echo "::error::deploys run only from $RELEASE_BRANCH (dispatched ref: ${{ github.ref_name }}). Re-run with --ref $RELEASE_BRANCH."
            exit 1
          fi
          echo "ref ${{ github.ref_name }} is the release branch"

  # ---- Build + push artifacts once, reused by every environment --------------
  build:
    needs: guard
    runs-on: ubuntu-latest
    # The image is built and scanned in the TARGET environment's own ECR repo
    # (round 7 WP-0): before this the build always pushed to luciel-dev-web, so a
    # prod dispatch rolled the prod service without ever having pushed a prod image.
    environment: ${{ inputs.environment || 'dev' }}
    env:
      ENVIRONMENT: ${{ inputs.environment || 'dev' }}
    outputs:
      image_tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS via OIDC (frontend deploy role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.ACCOUNT }}:role/luciel-${{ env.ENVIRONMENT }}-frontend-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: pnpm/action-setup@v4
        with: { version: 9.7.0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }

      - name: Install + build (web .next is baked into the image; widget dist here)
        run: |
          pnpm install --frozen-lockfile
          # The widget vite config defaults the adapter to 'mock'; this bundle is
          # published to the real embed.vantagemind.ai CDN, so it must be LIVE.
          VITE_WIDGET_ADAPTER=http \
          VITE_WIDGET_API_BASE_URL=https://api.vantagemind.ai \
            pnpm --filter @luciel/widget build   # -> apps/widget/dist

      - name: Build + push web image (context = repo root, Dockerfile apps/web)
        env:
          ECR: ${{ steps.ecr.outputs.registry }}
          REPO: luciel-${{ env.ENVIRONMENT }}-web
          TAG: ${{ github.sha }}
        run: |
          # --provenance/--sbom off: with them (the default on newer Docker engines) the
          # push is an OCI image INDEX holding an attestation manifest, which ECR's basic
          # scan-on-push never scans, so the CVE gate below finds no scan and fails closed
          # (deploy 43562167704, 2026-11-14). The backend builds the same way.
          docker build --provenance=false --sbom=false -f apps/web/Dockerfile \
            --build-arg NEXT_PUBLIC_API_BASE_URL=https://api.vantagemind.ai \
            --build-arg NEXT_PUBLIC_API_ADAPTER=http \
            --build-arg NEXT_PUBLIC_HCAPTCHA_SITE_KEY=6f66ccc8-ae5a-4d20-90f6-e49adfa8c10e \
            -t "$ECR/$REPO:$TAG" .
          # Only the commit tag is pushed here. `latest` is what the web task definition
          # runs, so it moves only in the deploy job, AFTER the CVE gate below passed:
          # pushing it here (until 2026-11-02) made a gate-refused image `latest`, and the
          # next task restart would have pulled it.
          docker push "$ECR/$REPO:$TAG"

      - name: Image CVE gate (fails closed; HIGH + CRITICAL; governed, expiring allowlist)
        env:
          REPO: luciel-${{ env.ENVIRONMENT }}-web
          TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Governed CVE gate (scripts/image-scan-gate.mjs, mirroring the backend's
          # scripts/check_image_scan.py): fails CLOSED on scan unavailability, on any
          # non-allowlisted CRITICAL or HIGH, and on expired allowlist entries. The
          # describe call is NOT error-swallowed — an API error must fail the deploy,
          # not print PASS (round 7 WP-0; the previous inline gate did exactly that).
          # Scan-on-push takes a few seconds to even REGISTER, so poll until the scan
          # exists and completes — the ECR waiter errors on ScanNotFound instead of
          # retrying (round 7: that raced the very first run of this gate). If it never
          # completes, scan-findings.json is absent or non-COMPLETE and the gate fails closed.
          for i in $(seq 1 60); do
            if aws ecr describe-image-scan-findings --repository-name "$REPO" --image-id imageTag="$TAG" --max-results 1000 --output json > scan-findings.json 2>/dev/null; then
              status=$(node -e "const s=JSON.parse(require('fs').readFileSync('scan-findings.json','utf8'));process.stdout.write(String(s.imageScanStatus?.status??''))")
              [ "$status" = "COMPLETE" ] && break
            fi
            echo "[gate] scan not ready (attempt $i) - waiting 5s"; sleep 5
          done
          node scripts/image-scan-gate.mjs scan-findings.json .security/cve-allowlist.json

      - name: Stash widget dist for deploy jobs
        uses: actions/upload-artifact@v4
        with:
          name: widget-dist
          path: apps/widget/dist

  # ---- Reusable deploy steps per environment --------------------------------
  deploy-dev:
    # A prod dispatch used to roll dev first; one wrong-ref prod dispatch overwrote
    # both environments. Dev now deploys only when dev was asked for.
    if: inputs.environment != 'prod'
    needs: [guard, build]
    runs-on: ubuntu-latest
    environment: dev
    env: { ENVIRONMENT: dev }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: widget-dist, path: dist }
      - name: Configure AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.ACCOUNT }}:role/luciel-${{ env.ENVIRONMENT }}-frontend-github-deploy
          aws-region: ${{ env.AWS_REGION }}
      - name: Promote web image tag for this env + roll the service
        env:
          TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          set -euo pipefail
          REPO=luciel-${ENVIRONMENT}-web
          # Promote the gated commit image to :latest (the tag the web task definition runs).
          # A missing image or a failed promotion fails the deploy: rolling the service
          # without it would restart the PREVIOUS image and still report success.
          MANIFEST=$(aws ecr batch-get-image --repository-name "$REPO" --image-ids imageTag="$TAG" \
            --query 'images[0].imageManifest' --output text)
          if [ -z "$MANIFEST" ] || [ "$MANIFEST" = "None" ]; then
            echo "::error::image $REPO:$TAG not found; nothing to promote"; exit 1
          fi
          CURRENT=$(aws ecr batch-get-image --repository-name "$REPO" --image-ids imageTag=latest \
            --query 'images[0].imageManifest' --output text 2>/dev/null || echo "")
          if [ "$CURRENT" != "$MANIFEST" ]; then
            aws ecr put-image --repository-name "$REPO" --image-tag latest --image-manifest "$MANIFEST" >/dev/null
          fi
          CLUSTER=$(aws ecs list-clusters --query "clusterArns[?contains(@,'Luciel-${ENVIRONMENT}-Web')]" --output text)
          for SVC in $(aws ecs list-services --cluster "$CLUSTER" --query 'serviceArns' --output text); do
            aws ecs update-service --cluster "$CLUSTER" --service "$SVC" --force-new-deployment
          done
      - name: Sync widget bundle + invalidate CloudFront
        env: { ENVIRONMENT: dev }
        run: |
          set -euo pipefail
          ACCT=$(aws sts get-caller-identity --query Account --output text)
          BUCKET=luciel-${ENVIRONMENT}-widget-${ACCT}
          aws s3 sync dist "s3://${BUCKET}/v1/" --delete --cache-control "public,max-age=31536000,immutable"
          # s3 sync guesses `text/javascript` with NO charset; the bundle carries UTF-8
          # literals (e.g. the 'Type your message…' placeholder), which browsers then
          # decode as latin-1 and render as mojibake. Re-upload the JS entrypoints with
          # an explicit charset.
          #
          # The entrypoints live at a FIXED url (`/v1/luciel.js` is what every customer
          # page embeds), so they must never be `immutable`: the 2026-09-06 E2E walk
          # found a visitor's browser still running the August bundle a day after the
          # deploy — a year-long immutable header on a fixed name means no widget fix
          # ever reaches a returning visitor. Five minutes + must-revalidate: the CDN
          # invalidation below covers the edge, this covers the browser. Hashed chunks
          # keep the long immutable header from the sync above.
          for f in luciel.js luciel.mjs; do
            aws s3 cp "dist/$f" "s3://${BUCKET}/v1/$f" \
              --content-type "text/javascript; charset=utf-8" \
              --cache-control "public,max-age=300,must-revalidate"
          done
          DIST=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?contains(Comment, 'Luciel ${ENVIRONMENT} widget')].Id" --output text)
          # No matching distribution is a warning (the bucket is updated; the edge serves
          # the old entrypoints until their five-minute cache expires). A failed
          # invalidation fails the step.
          if [ -z "$DIST" ] || [ "$DIST" = "None" ]; then
            echo "::warning::no CloudFront distribution matches 'Luciel ${ENVIRONMENT} widget'; nothing invalidated"
          elif ! aws cloudfront create-invalidation --distribution-id "$DIST" --paths '/v1/*' >/dev/null; then
            echo "::error::CloudFront invalidation of /v1/* failed on distribution $DIST"
            exit 1
          else
            echo "invalidated /v1/* on distribution $DIST"
          fi
      # A deploy must not say success before the roll ends: the update above returns in
      # seconds while ECS takes minutes to reach steady state (deploy 40239826580: 17 s
      # against 2.5 minutes), and a walk dispatched after a "green" deploy ran into two
      # builds serving at once. The waiter gives up after 10 minutes (40 polls, 15 s
      # apart) with a non-zero exit, which fails this job.
      - name: Wait for the web service roll to finish
        run: |
          set -euo pipefail
          CLUSTER=$(aws ecs list-clusters --query "clusterArns[?contains(@,'Luciel-${ENVIRONMENT}-Web')]" --output text)
          SERVICES=$(aws ecs list-services --cluster "$CLUSTER" --query 'serviceArns' --output text)
          aws ecs wait services-stable --cluster "$CLUSTER" --services $SERVICES

  # ---- prod: MANUAL approval gate. Never auto-deployed. ----------------------
  deploy-prod:
    needs: [guard, build]
    runs-on: ubuntu-latest
    # PROD GATE: this job runs only on a deliberate workflow_dispatch with
    # environment=prod (the `if` below), and it runs in the `prod` GitHub Environment,
    # whose required reviewer must approve it before any step starts.
    environment: prod
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'prod'
    env: { ENVIRONMENT: prod }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: widget-dist, path: dist }
      - name: Configure AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.ACCOUNT }}:role/luciel-${{ env.ENVIRONMENT }}-frontend-github-deploy
          aws-region: ${{ env.AWS_REGION }}
      - name: Roll web service + sync widget
        env:
          TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          set -euo pipefail
          ACCT=$(aws sts get-caller-identity --query Account --output text)
          REPO=luciel-${ENVIRONMENT}-web
          # Promote the gated commit image to :latest before the roll, as deploy-dev does:
          # the build job no longer pushes :latest, so rolling without this would restart
          # the previous image.
          MANIFEST=$(aws ecr batch-get-image --repository-name "$REPO" --image-ids imageTag="$TAG" \
            --query 'images[0].imageManifest' --output text)
          if [ -z "$MANIFEST" ] || [ "$MANIFEST" = "None" ]; then
            echo "::error::image $REPO:$TAG not found; nothing to promote"; exit 1
          fi
          CURRENT=$(aws ecr batch-get-image --repository-name "$REPO" --image-ids imageTag=latest \
            --query 'images[0].imageManifest' --output text 2>/dev/null || echo "")
          if [ "$CURRENT" != "$MANIFEST" ]; then
            aws ecr put-image --repository-name "$REPO" --image-tag latest --image-manifest "$MANIFEST" >/dev/null
          fi
          CLUSTER=$(aws ecs list-clusters --query "clusterArns[?contains(@,'Luciel-${ENVIRONMENT}-Web')]" --output text)
          for SVC in $(aws ecs list-services --cluster "$CLUSTER" --query 'serviceArns' --output text); do
            aws ecs update-service --cluster "$CLUSTER" --service "$SVC" --force-new-deployment
          done
          BUCKET=luciel-${ENVIRONMENT}-widget-${ACCT}
          aws s3 sync dist "s3://${BUCKET}/v1/" --delete --cache-control "public,max-age=31536000,immutable"
          # s3 sync guesses `text/javascript` with NO charset; the bundle carries UTF-8
          # literals (e.g. the 'Type your message…' placeholder), which browsers then
          # decode as latin-1 and render as mojibake. Re-upload the JS entrypoints with
          # an explicit charset.
          #
          # The entrypoints live at a FIXED url (`/v1/luciel.js` is what every customer
          # page embeds), so they must never be `immutable`: the 2026-09-06 E2E walk
          # found a visitor's browser still running the August bundle a day after the
          # deploy — a year-long immutable header on a fixed name means no widget fix
          # ever reaches a returning visitor. Five minutes + must-revalidate: the CDN
          # invalidation below covers the edge, this covers the browser. Hashed chunks
          # keep the long immutable header from the sync above.
          for f in luciel.js luciel.mjs; do
            aws s3 cp "dist/$f" "s3://${BUCKET}/v1/$f" \
              --content-type "text/javascript; charset=utf-8" \
              --cache-control "public,max-age=300,must-revalidate"
          done
          DIST=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?contains(Comment, 'Luciel ${ENVIRONMENT} widget')].Id" --output text)
          # No matching distribution is a warning (the bucket is updated; the edge serves
          # the old entrypoints until their five-minute cache expires). A failed
          # invalidation fails the step.
          if [ -z "$DIST" ] || [ "$DIST" = "None" ]; then
            echo "::warning::no CloudFront distribution matches 'Luciel ${ENVIRONMENT} widget'; nothing invalidated"
          elif ! aws cloudfront create-invalidation --distribution-id "$DIST" --paths '/v1/*' >/dev/null; then
            echo "::error::CloudFront invalidation of /v1/* failed on distribution $DIST"
            exit 1
          else
            echo "invalidated /v1/* on distribution $DIST"
          fi
      # A deploy must not say success before the roll ends: the update above returns in
      # seconds while ECS takes minutes to reach steady state (deploy 40239826580: 17 s
      # against 2.5 minutes), and a walk dispatched after a "green" deploy ran into two
      # builds serving at once. The waiter gives up after 10 minutes (40 polls, 15 s
      # apart) with a non-zero exit, which fails this job.
      - name: Wait for the web service roll to finish
        run: |
          set -euo pipefail
          CLUSTER=$(aws ecs list-clusters --query "clusterArns[?contains(@,'Luciel-${ENVIRONMENT}-Web')]" --output text)
          SERVICES=$(aws ecs list-services --cluster "$CLUSTER" --query 'serviceArns' --output text)
          aws ecs wait services-stable --cluster "$CLUSTER" --services $SERVICES
