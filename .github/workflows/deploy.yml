name: deploy

# `main` is a stale revert and is NOT deployable (see CLAUDE.md "Branch discipline").
# workflow_dispatch runs the workflow file AT THE DISPATCHED REF, so the guard on the
# release branch cannot protect a dispatch of main by itself — this file is that
# protection. 2026-09-06: a bare `gh workflow run` deployed main to dev for 25 minutes.
# Deploy from the release branch:
#   gh workflow run deploy.yml --ref feat/docs-conformance-build-20260713-r2 -f environment=dev
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Ignored — main is not deployable
        type: string
        default: dev

jobs:
  refuse:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::main is a stale revert and is not deployable. Deploy from the release branch: gh workflow run deploy.yml --ref feat/docs-conformance-build-20260713-r2 -f environment=dev"
          exit 1
