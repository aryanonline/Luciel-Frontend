name: dependabot-auto-merge

# Round 6 WP-B: a Dependabot PR that CI has proven green is merged without a person
# when it is a minor or patch update (single or the grouped "minor-and-patch" PR);
# a MAJOR bump is labelled `major-update` and left for a human, because a major is a
# migration, not an upkeep.
#
# Runs on the COMPLETION of the CI workflow for a Dependabot branch — never on the
# PR event itself — so the merge decision is made only after the same gate every
# other change passes (typecheck, tests, lint, build, the pnpm audit gate with its
# expiring waivers, the secret scan).

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-auto-merge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Merge a green minor/patch update, label a major
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          pr=$(gh pr list --repo "$REPO" --head "$HEAD_BRANCH" --state open \
                --json number,title,author,baseRefName --jq '.[0]')
          if [ -z "$pr" ] || [ "$pr" = "null" ]; then
            echo "no open PR for $HEAD_BRANCH — nothing to merge"; exit 0
          fi
          number=$(jq -r .number <<<"$pr")
          title=$(jq -r .title <<<"$pr")
          author=$(jq -r .author.login <<<"$pr")
          base=$(jq -r .baseRefName <<<"$pr")
          case "$author" in
            dependabot|app/dependabot|dependabot[bot]) ;;
            *) echo "PR #$number is not from Dependabot ($author) — leaving it"; exit 0 ;;
          esac
          echo "PR #$number → $base: $title"
          kind=$(python3 - "$title" <<'PY'
          import re, sys
          title = sys.argv[1]
          if "minor-and-patch group" in title:
              print("minor"); sys.exit()
          # A container base image IS the runtime (python:3.12 → 3.14 reads as "minor"
          # by version but is a language upgrade): always a person's call (2026-09-07).
          if re.search(r"(?i)\bbump (python|node)\b.* from ", title):
              print("runtime"); sys.exit()
          # pip requirement RANGES read "Update <pkg> requirement from <spec> to <spec>"
          # (e.g. "from <1.4,>=1.3.1 to >=1.3.1,<1.7"): compare the highest major bound
          # of each spec, so a widened range inside one major is upkeep and a new major
          # bound is a migration (round 7 WP-0; the old regex read these as "unknown").
          m = re.search(r"(?i)\brequirement from (.+?) to (.+?)$", title)
          if m:
              def top(spec):
                  majors = [int(v) for v in re.findall(r"(\d+)(?:\.\d+)*", spec)]
                  return max(majors) if majors else None
              a, b = top(m.group(1)), top(m.group(2))
              if a is None or b is None:
                  print("unknown"); sys.exit()
              print("major" if b != a else "minor"); sys.exit()
          m = re.search(r"from (\d+)(?:\.(\d+))?\S* to (\d+)(?:\.(\d+))?", title)
          if not m:
              print("unknown"); sys.exit()
          a_major, a_minor, b_major, b_minor = m.group(1), m.group(2), m.group(3), m.group(4)
          if a_major != b_major:
              print("major")
          elif a_major == "0" and a_minor != b_minor:
              # 0.x packages carry the breaking-change meaning in the SECOND component
              # (ruff 0.16 -> 0.17 changes rule sets): a person's call, not upkeep.
              print("major")
          else:
              print("minor")
          PY
          )
          echo "update kind: $kind"
          if [ "$kind" = "minor" ]; then
            # A refused merge (a check still pending, a conflict, a setting) must be
            # visible, not a silent exit 0 that leaves the PR open for weeks (round 7).
            if gh pr merge "$number" --repo "$REPO" --squash --delete-branch; then
              echo "merged #$number"
            else
              gh pr edit "$number" --repo "$REPO" --add-label auto-merge-failed || true
              gh pr comment "$number" --repo "$REPO" --body \
                "CI is green and this is a minor/patch update, but the automatic squash-merge was refused. A person needs to merge it (or fix what blocked the merge)."
              echo "::error::auto-merge of #$number was refused"; exit 1
            fi
          else
            gh pr edit "$number" --repo "$REPO" --add-label major-update || true
            gh pr comment "$number" --repo "$REPO" --body \
              "CI is green, but this is a **major** (or unclassifiable) update — a migration, not an upkeep. Left for a person to review and merge."
            echo "labelled #$number major-update"
          fi
