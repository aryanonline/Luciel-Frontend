name: CI

on:
  pull_request:
  push:
    branches:
      # The release branch, not the stale `main` (2026-09-07: also the default branch
      # now, so the daily schedule audits the code that ships).
      - feat/docs-conformance-build-20260713-r2
  # 2026-09-05 audit F039: dependencies rot between pushes. A daily run keeps the
  # audit and the secret scan current on a quiet branch too.
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch: {}

jobs:
  # ── Unit / lint / build gates ────────────────────────────────────────────────
  build:
    name: Typecheck · Test · Lint · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 2026-09-05 audit F076: the frontend had no dependency audit and no secret
      # scan while the backend gated on both. High+ vulnerabilities with a fix block.
      - name: Dependency audit (pnpm audit — blocks on high/critical; waivers expire)
        run: node scripts/audit-gate.mjs

      - name: Typecheck (all packages)
        run: pnpm -r typecheck

      - name: Unit tests (all packages)
        run: pnpm -r test

      - name: Lint (@luciel/web)
        run: pnpm --filter @luciel/web lint

      - name: Build (all packages)
        run: pnpm -r build

      - name: Widget bundle check — no admin surface
        run: node apps/widget/scripts/check-bundle.mjs

  # ── WCAG 2.1 AA accessibility gate (Commitment §30 / Axis11-F04) ─────────────
  # This is a REQUIRED gate: a PR that introduces AA violations is rejected.
  a11y:
    name: A11y — WCAG 2.1 AA (Playwright + axe-core)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @luciel/web exec playwright install --with-deps chromium

      - name: Run a11y e2e (axe-core/playwright, WCAG 2.1 AA)
        run: pnpm --filter @luciel/web test:e2e

  # ── Secret scan (2026-09-05 audit F076) ──────────────────────────────────────
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
