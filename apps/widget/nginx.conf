# Local demo site (apps/widget/Dockerfile): the demo website at /, the widget bundle at
# /v1/luciel.js as the embed CDN serves it.
server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Always fetch the current bundle and page, so a rebuilt image is picked up on reload.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location /v1/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
